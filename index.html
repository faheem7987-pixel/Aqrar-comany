<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQRAR COMPANY - لاگ اِن</title>
  <!-- موبائل کی ہوم اسکرین پر لوگو لانے کے لیے -->
<link rel="apple-touch-icon" href="img.gpj.jpeg">
<link rel="apple-touch-icon" sizes="180x180" href="img.gpj.jpeg">
<link rel="icon" type="image/jpeg" href="img.gpj.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --brand-blue: #1c325c;
      --border-color: #cbd5e1;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Arabic', sans-serif;
      background: var(--bg-page);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 390px;
      border-radius: 24px;
      padding: 34px 24px;
      box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
      text-align: center;
      border: 1.5px solid var(--border-color);
    }

    .logo-box {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 20px;
      overflow: hidden;
      background: #0f172a;
      border: 2px solid var(--border-color);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--brand-blue);
      margin-bottom: 2px;
    }

    .brand-sub {
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .form-group {
      text-align: right;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #334155;
    }

    .input-box {
      width: 100%;
      padding: 13px 14px;
      background: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
    }

    .input-box:focus {
      border-color: #0284c7;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--brand-blue);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(28, 50, 92, 0.25);
    }

    .btn-login:hover { background: #132442; }
    .error-msg { color: #dc2626; font-size: 0.88rem; margin-top: 12px; font-weight: bold; display: none; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-box">
      <img src="img.gpj.jpeg" alt="Logo" onerror="this.onerror=null; this.src='img.gpj'; this.onerror=function(){this.src='img.jpg';}">
    </div>

    <h1 class="brand-title">AQRAR COMPANY</h1>
    <p class="brand-sub">کنٹینر کھاتہ مینجمنٹ</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>سیکیورٹی پاس ورڈ درج کریں:</label>
        <input type="password" id="passInput" class="input-box" placeholder="••••••••" required autofocus>
      </div>

      <button type="submit" class="btn-login">سیستم میں داخل ہوں</button>
      <div id="errMsg" class="error-msg">غلط پاس ورڈ! دوبارہ کوشش کریں۔</div>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const p = document.getElementById('passInput').value.trim();
      if (p === 'admin123' || p === 'owner123') {
        localStorage.setItem('userAuth', 'true');
        window.location.href = 'jama.html';
      } else {
        document.getElementById('errMsg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
